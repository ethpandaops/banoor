name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch or PR; a newer push to a pull request cancels the older
# run, while every push to master runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: banoor
          CLICKHOUSE_PASSWORD: banoor
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-retries 20
    env:
      BANOOR_TEST_CLICKHOUSE_DSN: clickhouse://banoor:banoor@127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go test -race ./...
      - run: make vuln
      - run: make tidy-check

